# Package metadata for the other-distribution packages (.rpm, Arch, AppImage,
# AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh and packaging/arch/aur.sh. The installed tree comes from
# stage-tree.sh (there is no .deb).

NAME=creator-toolkit         # package name
APP_NAME=CreatorToolkit      # AppImage file name and display name
GITHUB_REPO=Dhiva-Labs/creator_toolkit
TAG_PREFIX=''                # release tags are the bare version, as in the other Dhiva Labs Flutter apps
SUMMARY='Compress, resize and convert images, video, audio and PDFs for sharing'
DESCRIPTION='Creator Toolkit helps content creators optimize and convert media before sharing it online: compress, resize, crop and convert images (JPG, PNG, WEBP), compress, convert and trim video (MP4, MKV, MOV, WEBM, GIF), compress and convert audio (MP3, M4A, WAV, FLAC, OGG), compress, merge and split PDFs, and export images sized for social media. Fully offline. The video and audio tools and WEBP output use ffmpeg.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/creator_toolkit
# The repository has no licence file, so no open-source licence is claimed.
LICENSE=LicenseRef-proprietary
LICENSE_FILE=''

# Files of the bundle that the packages leave out. libdartjni.so comes from
# the jni plugin (an Android dependency); CMake builds it only because the
# CI runner has a JDK, and it links that runner's libjvm.so by absolute
# path. Nothing loads it on desktop Linux, and shipping it would make the
# rpm require a JVM.
EXCLUDE=(usr/lib/creator-toolkit/lib/libdartjni.so)

# rpm: shared-library dependencies are worked out from the ELF files. List
# only what the app runs (tools it executes), as file paths. "Show in
# folder" uses xdg-open. ffmpeg and ffprobe run the video and audio tools
# and WEBP output; the image (JPG/PNG) and PDF tools work without them, and
# the app says so when they are missing, so they are weak dependencies,
# which dnf and zypper install by default.
# Flutter's engine also opens libEGL and libGLESv2 at run time (through
# libepoxy, so they are no ELF dependencies): required by capability, which
# libglvnd provides on Fedora and openSUSE alike.
RPM_REQUIRES=(/usr/bin/xdg-open 'libEGL.so.1()(64bit)' 'libGLESv2.so.2()(64bit)')
RPM_RECOMMENDS=(/usr/bin/ffmpeg /usr/bin/ffprobe)
# Arch: package names, written by hand (Arch has no soname dependencies for
# most libraries). CI's ldd check on archlinux:latest keeps this honest.
ARCH_DEPENDS=(gtk3 xdg-utils libglvnd)
ARCH_OPTDEPENDS=('ffmpeg: video and audio tools and WEBP output')
ARCH_INDEPENDENT=0           # 1 for pure-Python/shell packages (noarch / any)

# AppImage (GUI apps): paths relative to the installed tree.
APPIMAGE=1
EXEC=usr/lib/creator-toolkit/creator_toolkit
DESKTOP=usr/share/applications/com.dhivalabs.creator_toolkit.desktop
ICON=usr/share/icons/hicolor/256x256/apps/creator-toolkit.png
APPRUN_ENV=''

# Smoke tests run in each distribution container by verify.sh, as the
# tarball's smoke run: the GTK runner shows its "Creator Toolkit" window
# only after Flutter rendered the first frame, so the AOT code ran.
GUI_CMD=creator-toolkit
GUI_ARGS=''
SMOKE_SETUP=''
SMOKE_READY="xdotool search --onlyvisible --name '^Creator Toolkit\$' > /dev/null"
SMOKE_SECONDS=90
SMOKE_CMD=''
SMOKE_EXPECT=''
